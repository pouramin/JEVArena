name: Package Windows ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'START_WINDOWS.bat'
      - 'BUILD_WINDOWS.bat'
      - 'package.json'
      - 'src/**'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/package-windows.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: zip -r JEVArena-Windows.zip . -x '.git/*' 'node_modules/*' 'dist/*' 'JEVArena-Windows.zip'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JEVArena-Windows
          path: JEVArena-Windows.zip
          retention-days: 7